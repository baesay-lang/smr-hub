<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMR 번역기</title>
<link rel="icon" type="image/png" href="app-icon-192.png">
<meta name="theme-color" content="#2563eb">
<script>(function(){try{var t=localStorage.getItem('smrhub-theme');if(t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="translator.css">
</head>
<body>
<nav class="topnav">
  <span class="brand">SMR 번역기</span>
  <button id="themeBtn" class="theme-btn" title="라이트/다크"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
</nav>

<main class="tr-main">
  <!-- 기본(간편) 컨트롤 -->
  <div class="tr-bar card">
    <button id="toggleBtn" class="btn-primary"><svg id="toggleIcon" class="ic ic-fill" viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5z"/></svg><span id="toggleLabel">시작</span></button>

    <label class="switch src-ctl" title="온라인 회의=시스템 오디오 / 대면=마이크">
      <select id="sourceSel" class="src-sel">
        <option value="system">시스템 오디오</option>
        <option value="mic">마이크</option>
      </select>
    </label>

    <label class="switch" title="영어를 한국어로 번역">
      <input type="checkbox" id="translateChk" checked><span>번역</span>
    </label>

    <span class="tr-fontctl">
      <span class="lbl">글자</span>
      <input type="range" id="fontRange" min="14" max="34" value="16">
    </span>

    <span class="save-wrap">
      <button id="saveBtn" class="btn-ghost" title="자막·번역·음성 저장" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>저장<svg class="ic-caret" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      <div id="saveMenu" class="save-menu" hidden>
        <button data-fmt="docx">Word 문서 (.docx)</button>
        <button data-fmt="txt">텍스트 (.txt)</button>
        <button data-fmt="json">데이터 (.json)</button>
        <button data-fmt="audio" id="saveAudioItem">오디오 (.mp3)</button>
      </div>
    </span>
    <button id="momBtn" class="btn-ghost" title="회의록(MoM) 자동작성"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="15" y1="13" x2="9" y2="13"/><line x1="15" y1="17" x2="9" y2="17"/></svg>MoM</button>

    <span class="tr-spacer"></span>
    <span id="statePill" class="state-pill" style="display:none"></span>
    <button id="spkBtn" class="btn-ghost" title="화자 목록"><svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>화자</button>
    <button id="settingsBtn" class="btn-ghost" title="관리자 — API 키·비용·녹음·회의명"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3.1 7.7-7 9-3.9-1.3-7-4.4-7-9V6z"/><path d="M9.3 12l1.8 1.8L15 10"/></svg>관리자</button>
  </div>

  <!-- 자막 + 화자 패널 -->
  <div class="tr-body">
    <div id="captions" class="tr-captions card" aria-live="polite"></div>
    <aside id="spkPanel" class="tr-spkpanel card" hidden>
      <div class="spk-head">
        <span>화자</span>
        <button id="spkAddBtn" class="spk-add" title="화자 추가">+</button>
      </div>
      <div id="spkList" class="spk-list"></div>
      <div class="muted small spk-note">자막의 이름표를 클릭하면 여기 목록에서 화자를 고르거나 직접 바꿀 수 있어요.</div>
    </aside>
  </div>
  <div id="interim" class="tr-interim"></div>
  <div id="status" class="tr-status">시작을 누르면 통역이 시작됩니다</div>
</main>

<!-- 설정/전문가 모달 -->
<div id="settingsModal" class="modal-back" hidden>
  <div class="modal card">
    <div class="modal-head">
      <h2 class="section-title">관리자</h2>
      <button id="settingsClose" class="btn-ghost">✕</button>
    </div>

    <div class="set-group">
      <div class="set-title">API 키 <span class="muted">(브라우저에만 저장 · 깃 안 올라감)</span></div>
      <label class="set-row"><span>Soniox</span><input type="password" id="sonioxKey" class="search" placeholder="sk_..."></label>
      <label class="set-row"><span>Anthropic</span><input type="password" id="anthropicKey" class="search" placeholder="sk-ant-..."></label>
    </div>

    <div class="set-group">
      <div class="set-title">비용 모드</div>
      <div class="filters" id="costPreset">
        <span class="chip active" data-cost="max">최대 품질</span>
        <span class="chip" data-cost="balanced">균형</span>
        <span class="chip" data-cost="min">최소 비용</span>
      </div>
      <div class="muted small">최대 품질 = 상위 모델(Sonnet)로 번역·회의록. 기본값.</div>
    </div>

    <div class="set-group">
      <div class="set-title">녹음 저장</div>
      <label class="switch"><input type="checkbox" id="recordChk" checked><span>회의 오디오 녹음 (정지 시 .mp3 저장 가능)</span></label>
      <div class="muted small">MP3로 저장돼 어디서나 바로 재생됩니다(1시간 ≈ 14MB). 자막·번역 기록(txt·json)은 항상 저장됩니다.</div>
    </div>

    <div class="set-group">
      <label class="set-row"><span>회의명</span><input type="text" id="meetingTitle" class="search" placeholder="(비우면 자동: 회의 날짜·시간)"></label>
      <div class="muted small">데이터: <span id="dataStatus">로딩 중…</span></div>
    </div>

    <div class="modal-foot">
      <button id="settingsSave" class="btn-primary">저장</button>
    </div>
  </div>
</div>

<!-- 회의록(MoM) 자동작성 모달 -->
<div id="momModal" class="modal-back" hidden>
  <div class="modal card mom-modal">
    <div class="modal-head">
      <h2 class="section-title">회의록(MoM) 자동작성</h2>
      <button id="momClose" class="btn-ghost">✕</button>
    </div>

    <div class="set-group">
      <div class="set-row mom-actions">
        <button id="momGen" class="btn-primary">초안 생성</button>
      </div>
    </div>

    <div class="set-group">
      <textarea id="momText" class="mom-text" placeholder="여기에 MoM 초안이 표시됩니다. 직접 수정한 뒤 저장하세요."></textarea>
    </div>

    <div class="modal-foot mom-foot">
      <span id="momStatus" class="muted small"></span>
      <span class="mom-savebtns">
        <button id="momSaveDocx" class="btn-ghost" disabled>Word 저장</button>
        <button id="momSaveTxt" class="btn-ghost" disabled>텍스트 저장</button>
      </span>
    </div>
  </div>
</div>

<script src="vendor/lame.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
