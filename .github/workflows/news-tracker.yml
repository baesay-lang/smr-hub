name: SMR news tracker

on:
  schedule:
    - cron: '31 21 * * *'      # ~06:31 KST  (avoid :00 — GitHub drops top-of-hour crons)
    - cron: '31 3 * * *'       # ~12:31 KST noon
  workflow_dispatch: {}        # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install deps
        run: npm install rss-parser --no-save

      - name: Collect & classify news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/track-news.mjs

      - name: Commit & push directly if news-data.js changed
        run: |
          if [ -n "$(git status --porcelain news-data.js)" ]; then
            git config user.name "smr-news-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news-data.js
            git commit -m "chore(news): auto-tracked SMR news"
            git push
            echo "News update pushed to main — live after Pages rebuild."
          else
            echo "No new news this run."
          fi
