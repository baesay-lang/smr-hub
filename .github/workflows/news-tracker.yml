name: SMR news tracker

on:
  schedule:
    # GitHub frequently delays/drops cron — so fire several times per window. The script skips a
    # redundant commit when it already updated within the last few hours (see track-news.mjs).
    - cron: '31 21 * * *'      # ~06:31 KST  (avoid :00 — GitHub drops top-of-hour crons)
    - cron: '9 22 * * *'       # ~07:09 KST  (morning retry)
    - cron: '49 22 * * *'      # ~07:49 KST  (morning retry)
    - cron: '31 3 * * *'       # ~12:31 KST noon
    - cron: '9 4 * * *'        # ~13:09 KST  (noon retry)
    - cron: '49 4 * * *'       # ~13:49 KST  (noon retry)
  workflow_dispatch:           # allow manual run from the Actions tab
    inputs:
      backfill:
        description: '기존 항목 요약을 더 길게 1회 재생성'
        type: boolean
        default: false
      refreshterms:
        description: '기존 기사 용어(glossary)만 재정리'
        type: boolean
        default: false

# serialize runs so two never race on the git push (which silently loses one run's commit)
concurrency:
  group: news-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install deps
        run: npm install rss-parser --no-save

      - name: Collect & classify news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL: ${{ github.event.inputs.backfill }}
          REFRESH_TERMS: ${{ github.event.inputs.refreshterms }}
        run: node scripts/track-news.mjs

      - name: Commit & push directly if news-data.js changed
        run: |
          if [ -n "$(git status --porcelain news-data.js articles)" ]; then
            git config user.name "smr-news-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news-data.js articles
            git commit -m "chore(news): auto-tracked SMR news"
            git push
            echo "News update pushed to main — live after Pages rebuild."
          else
            echo "No new news this run."
          fi
